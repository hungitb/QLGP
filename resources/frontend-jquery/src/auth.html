<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý gia phả</title>
</head>

<body>
    <section class="bg-light" id="root" style="display: none;">
        <div class="container">
            <div class="row align-items-center justify-content-center" style="height: 100vh">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                    <div class="card border border-light-subtle rounded-3 shadow-sm">
                        <div class="card-body p-3 p-md-4 p-xl-5" id="container">
                            <div class="text-center mb-3">
                                <img src="./static/logo.png" alt="BootstrapBrain Logo" style="width: 20rem; padding-bottom: 2rem;">
                            </div>
                            <div id="login">
                                <h2 class="fs-6 fw-normal text-center text-secondary mb-4">Đăng nhập vào tài khoản của bạn</h2>
                                <form>
                                    <div class="row gy-2 overflow-hidden">
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="email" class="form-control" name="username" id="username"
                                                    placeholder="quanlygiapha123">
                                                <label for="email" class="form-label">Username</label>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="password" class="form-control" name="password" id="password"
                                                    value="" placeholder="Password">
                                                <label for="password" class="form-label">Password</label>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                        <div class="col-12" hidden>
                                            <div class="d-flex gap-2 justify-content-between">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" value=""
                                                        name="rememberMe" id="rememberMe">
                                                    <label class="form-check-label text-secondary" for="rememberMe">
                                                        Keep me logged in
                                                    </label>
                                                </div>
                                                <a href="#!" class="link-primary text-decoration-none">Forgot password?</a>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="d-grid my-3">
                                                <button id="login-btn" class="btn btn-primary btn-lg">Đăng nhập</button>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <p class="m-0 text-secondary text-center">
                                                Bạn chưa có tài khoản?
                                                <a id="switch-to-signin" class="link-primary text-decoration-none" style="cursor: pointer;">
                                                    Đăng ký
                                                </a>
                                            </p>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div id="signin"">
                                <h2 class="fs-6 fw-normal text-center text-secondary mb-4">Đăng ký tài khoản</h2>
                                <form>
                                    <div class="row gy-2 overflow-hidden">
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="email" class="form-control" name="username" id="username"
                                                    placeholder="quanlygiapha123">
                                                <label for="email" class="form-label">Username</label>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="password" class="form-control" name="password" id="password"
                                                    value="" placeholder="Password">
                                                <label for="password" class="form-label">Password</label>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="password" class="form-control" name="retype-password" id="retype-password"
                                                    value="" placeholder="Password">
                                                <label for="password" class="form-label">Nhập lại Password</label>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                        <div class="col-12" hidden>
                                            <div class="d-flex gap-2 justify-content-between">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" value=""
                                                        name="rememberMe" id="rememberMe">
                                                    <label class="form-check-label text-secondary" for="rememberMe">
                                                        Keep me logged in
                                                    </label>
                                                </div>
                                                <a href="#!" class="link-primary text-decoration-none">Forgot password?</a>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="d-grid my-3">
                                                <button id="signin-btn" class="btn btn-primary btn-lg">Đăng ký</button>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <p class="m-0 text-secondary text-center">
                                                Bạn đã có tài khoản?
                                                <a id="switch-to-login" class="link-primary text-decoration-none" style="cursor: pointer;">
                                                    Đăng nhập
                                                </a>
                                            </p>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>

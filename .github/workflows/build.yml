name: CICD
on:
  push:
    branches:
      - main
jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract commit SHA
        id: commit
        run: echo "sha_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BE & FE docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-be:${{ steps.commit.outputs.sha_tag }} -t ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-be:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-be:${{ steps.commit.outputs.sha_tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-be:latest

      - name: Build and push fuseki docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-fuseki:${{ steps.commit.outputs.sha_tag }} -t ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-fuseki:latest fuseki
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-fuseki:${{ steps.commit.outputs.sha_tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qlgp-fuseki:latest
